[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geobio"
version = "2.0.6"
description = "GeoBio 2.0 — utilities for eBird checklist filtering, presence/absence building and spatial/seasonal visualisation"
authors = [{name = "Tiago Alejo Herrador"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["folium", "geopandas", "matplotlib", "numpy", "pandas", "rasterio", "scikit-learn", "seaborn", "shapely", "statsmodels"]

[tool.setuptools]
packages = ["geobio"]
